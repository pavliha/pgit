services:
  db:
    build:
      context: ./docker
      args:
        PG: "${PG:-18}"
    environment:
      POSTGRES_PASSWORD: grove
      POSTGRES_DB: grove_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5460:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grove_test"]
      interval: 2s
      timeout: 3s
      retries: 30
