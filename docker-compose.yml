services:
  db:
    build: ./docker
    environment:
      POSTGRES_PASSWORD: pgit
      POSTGRES_DB: pgit_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5460:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
